steps:
  - name: Start Edge and open Odoo trial
    action: Helium.StartEdge
    params:
      port: "${DEBUG_PORT}"
      open_url: "${ODOO_TRIAL_URL}"
      target_type: page
      exclude_url_contains: "devtools://|edge://|chrome://"

  - name: Wait for Odoo trial page
    action: Helium.WaitUntilUrl
    params:
      port: "${DEBUG_PORT}"
      host_endswith: "odoo.com"
      url_contains: "/trial"
      timeout_secs: 30
      interval_ms: 400

  - name: Dismiss cookie/consent banner (best-effort)
    confirm_progress: false
    loop:
      - "Accept"
      - "Aceptar"
      - "I agree"
      - "Allow"
      - "OK"
    steps:
      - name: Click consent button: ${loop.item}
        action: Helium.Click
        register: consent_click
        ignore_errors: true
        confirm_progress: false
        params:
          port: "${DEBUG_PORT}"
          text: "${loop.item}"
          implicit_wait_ms: 800
          retry_interval_ms: 150
      - break_if: "${consent_click.ok}"

  - name: Select app tile (eCommerce)
    loop:
      - "Comercio electrónico"
      - "eCommerce"
      - "Ecommerce"
      - "Website"
      - "Sitio web"
      - "Shop"
      - "Tienda"
    steps:
      - name: Click app tile: ${loop.item}
        action: Helium.Click
        register: app_click
        ignore_errors: true
        confirm_after_wait_ms: 1200
        params:
          port: "${DEBUG_PORT}"
          text: "${loop.item}"
          implicit_wait_ms: 5000
          retry_interval_ms: 200

      - name: Find app tile in-page (Ctrl+F style): ${loop.item}
        if_not: "${app_click.ok}"
        action: Helium.FindInPage
        register: app_find
        ignore_errors: true
        confirm_progress: false
        params:
          port: "${DEBUG_PORT}"
          text: "${loop.item}"
          highlight_ms: 1200

      - name: Click app tile via selection point: ${loop.item}
        if: "${app_find.found}"
        action: Helium.Click
        register: app_click
        ignore_errors: true
        confirm_after_wait_ms: 1200
        params:
          port: "${DEBUG_PORT}"
          element: "${app_find.point}"
          implicit_wait_ms: 3000
          retry_interval_ms: 150
      - break_if: "${app_click.ok}"

  - name: Abort if eCommerce app tile was not found
    if_not: "${app_click.ok}"
    action: Fail
    params:
      text: |
        Could not select the eCommerce app tile on the Odoo trial page.

        Try running with env=debug to capture evidence, or check:
        - ${OUTPUT_DIR}\\debug_evidence

  - name: Click Continue (after app selection)
    loop:
      - "Continue"
      - "Continuar"
      - "Next"
    steps:
      - name: Click continue button: ${loop.item}
        action: Helium.Click
        register: continue_click
        ignore_errors: true
        confirm_after_wait_ms: 1200
        params:
          port: "${DEBUG_PORT}"
          element:
            kind: button
            text: "${loop.item}"
          implicit_wait_ms: 5000
          retry_interval_ms: 200

      - name: Find continue in-page (Ctrl+F style): ${loop.item}
        if_not: "${continue_click.ok}"
        action: Helium.FindInPage
        register: continue_find
        ignore_errors: true
        confirm_progress: false
        params:
          port: "${DEBUG_PORT}"
          text: "${loop.item}"
          highlight_ms: 1200

      - name: Click continue via selection point: ${loop.item}
        if: "${continue_find.found}"
        action: Helium.Click
        register: continue_click
        ignore_errors: true
        confirm_after_wait_ms: 1200
        params:
          port: "${DEBUG_PORT}"
          element: "${continue_find.point}"
          implicit_wait_ms: 3000
          retry_interval_ms: 150
      - break_if: "${continue_click.ok}"

  - name: Abort if Continue button was not found
    if_not: "${continue_click.ok}"
    action: Fail
    params:
      text: |
        Could not click the Continue button after selecting the app.

        Evidence:
        - ${OUTPUT_DIR}\\debug_evidence

  - name: Check if we are on an Odoo instance already
    action: Helium.GetUrlMeta
    register: odoo_url_meta_pre
    params:
      port: "${DEBUG_PORT}"
      main_domain: "odoo.com"
      reserved_subdomains:
        - "www"
      exclude_url_regex: "i)/trial"
      expected_base: "${ODOO_INSTANCE_ALIAS_BASE}"

  - name: Skip auth/forms if instance already reached
    if: "${odoo_url_meta_pre.is_instance}"
    action: Set
    params:
      name: created_instance
      value:
        confirmed: true
        mode: "already_on_instance"
        probe: "${odoo_url_meta_pre}"

  - name: Check for login page (best-effort)
    if_not: "${odoo_url_meta_pre.is_instance}"
    action: Helium.WaitUntilUrl
    register: login_page_meta
    ignore_errors: true
    confirm_progress: false
    params:
      port: "${DEBUG_PORT}"
      url_contains: "/web/login"
      timeout_secs: 2
      interval_ms: 200

  - name: Login (autonomous)
    if_not: "${odoo_url_meta_pre.is_instance}"
    if: "${login_page_meta.ok}"
    steps:
      - name: Try fill login email from secrets
        if: "${ODOO_LOGIN_EMAIL}"
        action: Helium.Write
        confirm_after_wait_ms: 500
        params:
          port: "${DEBUG_PORT}"
          text: "${ODOO_LOGIN_EMAIL}"
          into:
            kind: s
            selector: "input[name='login'], input[type='email'], input[autocomplete='username'], input[autocomplete='email']"
          implicit_wait_ms: 6000
          retry_interval_ms: 200

      - name: Password manager pick email (best-effort)
        if_not: "${ODOO_LOGIN_EMAIL}"
        confirm_progress: false
        steps:
          - action: Helium.Click
            ignore_errors: true
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              element:
                kind: s
                selector: "input[name='login'], input[type='email'], input[autocomplete='username'], input[autocomplete='email']"
              implicit_wait_ms: 1500
              retry_interval_ms: 150
          - action: Helium.Press
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              key: "DOWN"
          - action: Helium.Press
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              key: "ENTER"

      - name: Try fill password from secrets
        if: "${ODOO_LOGIN_PASSWORD}"
        action: Helium.Write
        confirm_after_wait_ms: 500
        params:
          port: "${DEBUG_PORT}"
          text: "${ODOO_LOGIN_PASSWORD}"
          into:
            kind: s
            selector: "input[type='password'], input[autocomplete='current-password'], input[name='password']"
          implicit_wait_ms: 6000
          retry_interval_ms: 200

      - name: Password manager pick password (best-effort)
        if_not: "${ODOO_LOGIN_PASSWORD}"
        confirm_progress: false
        steps:
          - action: Helium.Click
            ignore_errors: true
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              element:
                kind: s
                selector: "input[type='password'], input[autocomplete='current-password'], input[name='password']"
              implicit_wait_ms: 1500
              retry_interval_ms: 150
          - action: Helium.Press
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              key: "DOWN"
          - action: Helium.Press
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              key: "ENTER"

      - name: Click Sign in
        action: Helium.Click
        confirm_after_wait_ms: 1200
        params:
          port: "${DEBUG_PORT}"
          element:
            kind: button
            text: "Sign in"
          implicit_wait_ms: 8000
          retry_interval_ms: 250

  - name: Trial signup form (autonomous, best-effort)
    if_not: "${odoo_url_meta_pre.is_instance}"
    steps:
      - name: Only when not on login page
        if_not: "${login_page_meta.ok}"
        steps:
          - name: Wait for trial email field
            action: Helium.WaitUntil
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              timeout_secs: 25
              interval_ms: 300
              exists:
                kind: s
                selector: "input[type='email'], input[name*='email' i], input[autocomplete='email']"

          - name: Focus trial email field
            action: Helium.Click
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              element:
                kind: s
                selector: "input[type='email'], input[name*='email' i], input[autocomplete='email']"
              implicit_wait_ms: 8000
              retry_interval_ms: 200

          - name: Fill trial email (from secrets)
            if: "${TRIAL_EMAIL}"
            action: Helium.Write
            confirm_after_wait_ms: 500
            params:
              port: "${DEBUG_PORT}"
              text: "${TRIAL_EMAIL}"
              into:
                kind: s
                selector: "input[type='email'], input[name*='email' i], input[autocomplete='email']"
              implicit_wait_ms: 8000
              retry_interval_ms: 200

          - name: Pick trial email from browser saved autofill (best-effort)
            if_not: "${TRIAL_EMAIL}"
            confirm_progress: false
            steps:
              - name: Select first suggestion
                action: Helium.Press
                confirm_progress: false
                params:
                  port: "${DEBUG_PORT}"
                  key: "DOWN"
              - name: Accept suggestion
                action: Helium.Press
                confirm_progress: false
                params:
                  port: "${DEBUG_PORT}"
                  key: "ENTER"
              - name: Read selected trial email value
                action: Helium.GetValue
                register: trial_email_val
                confirm_progress: false
                params:
                  port: "${DEBUG_PORT}"
                  element:
                    kind: s
                    selector: "input[type='email'], input[name*='email' i], input[autocomplete='email']"
              - name: Export selected email into context
                action: Set
                confirm_progress: false
                params:
                  name: TRIAL_EMAIL
                  value: "${trial_email_val.value}"

          - name: Abort if trial email is still missing
            if_not: "${TRIAL_EMAIL}"
            action: Fail
            params:
              text: |
                Missing TRIAL_EMAIL (odoo.trial_email), and browser autofill did not provide a value.

                Provide it via:
                - ${SCRIPT_DIR}\\secrets.yml
                - ${ROOT_PLAYBOOK_DIR}\\secrets.yml
                - ${ROOT_PLAYBOOK_DIR}\\.secrets.yml

          - name: Fill trial phone (optional)
            if: "${TRIAL_PHONE}"
            action: Helium.Write
            ignore_errors: true
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              text: "${TRIAL_PHONE}"
              into:
                kind: s
                selector: "input[type='tel'], input[name*='phone' i], input[autocomplete='tel']"
              implicit_wait_ms: 1500
              retry_interval_ms: 150

          - name: Fill contact name (optional)
            if: "${TRIAL_CONTACT_NAME}"
            action: Helium.Write
            ignore_errors: true
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              text: "${TRIAL_CONTACT_NAME}"
              into:
                kind: s
                selector: "input[name*='name' i], input[autocomplete='name']"
              implicit_wait_ms: 1500
              retry_interval_ms: 150

          - name: Fill company name (optional)
            if: "${TRIAL_COMPANY_NAME}"
            action: Helium.Write
            ignore_errors: true
            confirm_progress: false
            params:
              port: "${DEBUG_PORT}"
              text: "${TRIAL_COMPANY_NAME}"
              into:
                kind: s
                selector: "input[name*='company' i], input[autocomplete='organization']"
              implicit_wait_ms: 1500
              retry_interval_ms: 150

          - name: Submit trial form (Continue/Create)
            loop:
              - "Continue"
              - "Create"
              - "Start"
              - "Get started"
              - "Comenzar"
              - "Crear"
              - "Continuar"
            steps:
              - name: Click submit button: ${loop.item}
                action: Helium.Click
                register: trial_submit_click
                ignore_errors: true
                confirm_after_wait_ms: 1200
                params:
                  port: "${DEBUG_PORT}"
                  element:
                    kind: button
                    text: "${loop.item}"
                  implicit_wait_ms: 4000
                  retry_interval_ms: 200
              - break_if: "${trial_submit_click.ok}"

  - name: Wait for provisioned Odoo instance URL
    if_not: "${odoo_url_meta_pre.is_instance}"
    action: Helium.WaitUntilUrl
    params:
      port: "${DEBUG_PORT}"
      host_endswith: ".odoo.com"
      host_not_equals: "www.odoo.com"
      url_not_contains: "/trial"
      timeout_secs: 600
      interval_ms: 800

  - name: Capture Odoo instance URL metadata
    action: Helium.GetUrlMeta
    register: odoo_url_meta
    params:
      port: "${DEBUG_PORT}"
      main_domain: "odoo.com"
      reserved_subdomains:
        - "www"
      exclude_url_regex: "i)/trial"
      expected_base: "${ODOO_INSTANCE_ALIAS_BASE}"

  - name: Abort if not on provisioned Odoo instance
    if_not: "${odoo_url_meta.is_instance}"
    action: Fail
    params:
      text: "Detected URL is not a provisioned Odoo instance: ${odoo_url_meta.url}"

  - name: Abort if alias base does not match expected electroprice naming
    if_not: "${odoo_url_meta.alias_base_match}"
    action: Fail
    params:
      text: "Detected Odoo instance alias does not match expected base '${ODOO_INSTANCE_ALIAS_BASE}': ${odoo_url_meta.url}"

  - name: Capture screenshot after instance creation
    action: DemoCreator.CaptureScreenshot
    params:
      port: "${DEBUG_PORT}"
      target_type: page
      target_url_contains: ".odoo.com"
      output_path: "${OUTPUT_DIR}\\odoo_trial_after.png"
      format: "png"

  - name: Persist Odoo instance URL
    action: FS.WriteText
    params:
      path: "${OUTPUT_DIR}\\odoo_instance_url.txt"
      text: "${odoo_url_meta.url}"
      overwrite: true

  - name: Persist Odoo instance alias
    action: FS.WriteText
    params:
      path: "${OUTPUT_DIR}\\odoo_instance_alias.txt"
      text: "${odoo_url_meta.subdomain}"
      overwrite: true

  - name: Export ODOO_URL into context for subsequent playbooks
    action: Set
    params:
      name: ODOO_URL
      value: "${odoo_url_meta.url}"
