steps:
  - name: Ensure we have an Odoo URL from previous step
    if_not: "${ODOO_URL}"
    action: Note
    params:
      text: |
        Falta ODOO_URL en el contexto.

        Corre primero el subplaybook:
          playbooks/odoo/trial/create/playbook.yml

  - name: Abort because ODOO_URL is missing
    if_not: "${ODOO_URL}"
    action: Shell.Run
    params:
      command: "exit 1"

  - name: Connect to Odoo tab (CDP)
    action: CDP.Connect
    params:
      port: "${DEBUG_PORT}"
      open_url: "${ODOO_URL}"
      target_type: page
      target_url_contains: ".odoo.com"

  - name: Navigate to Odoo instance
    action: CDP.Navigate
    params:
      port: "${DEBUG_PORT}"
      url: "${ODOO_URL}"
      wait_ms: 4000

  - name: Autonomous mode: continue without manual prompt
    if: "${AUTONOMOUS_MODE}"
    action: Set
    params:
      name: ecommerce_installed
      value:
        confirmed: true
        mode: "autonomous"

  - name: Interactive fallback: install eCommerce module
    if_not: "${AUTONOMOUS_MODE}"
    action: Framework.Prompt
    register: ecommerce_installed
    params:
      title: "Electroprice / Odoo Setup"
      icon: info
      buttons: ok
      text: |
        Instala el modulo eCommerce en Odoo:
        - Ve a Apps
        - Busca "eCommerce"
        - Instala

        Cuando termine, presiona OK para continuar.

  - name: Abort if eCommerce was not installed
    if_not: "${ecommerce_installed.confirmed}"
    action: Shell.Run
    params:
      command: "exit 1"

  - name: Persist installation checkpoint
    action: FS.WriteJson
    params:
      path: "${OUTPUT_DIR}\\odoo_ecommerce_install_checkpoint.json"
      value:
        ok: true
        odoo_url: "${ODOO_URL}"
      overwrite: true
