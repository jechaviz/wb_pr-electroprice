steps:
  - name: Ensure ODOO_URL exists
    if_not: "${ODOO_URL}"
    action: Fail
    params:
      text: "Missing ODOO_URL before branding configuration."

  - name: Connect to Odoo tab
    action: CDP.Connect
    params:
      port: "${DEBUG_PORT}"
      open_url: "${ODOO_URL}"
      target_type: page
      target_url_contains: ".odoo.com"

  - name: Navigate to Odoo instance
    action: CDP.Navigate
    params:
      port: "${DEBUG_PORT}"
      url: "${ODOO_URL}"
      wait_ms: 2000

  - name: Load Odoo branding configurator script
    action: FS.ReadText
    register: js_odoo_branding
    params:
      path: "${PLAYBOOKS_DIR}\\js\\odoo\\rpc_configure_branding.js"

  - name: Execute Odoo branding configuration via in-session JSON-RPC
    action: CDP.EvaluateJson
    register: branding_result
    params:
      port: "${DEBUG_PORT}"
      await_promise: true
      expression: "${js_odoo_branding}"

  - name: Abort if branding did not complete
    if_not: "${branding_result.ok}"
    action: Fail
    params:
      text: "Branding configuration failed: ${branding_result.error}${branding_result.reason}"

  - name: Persist branding checkpoint
    action: FS.WriteJson
    params:
      path: "${OUTPUT_DIR}\\odoo_branding_checkpoint.json"
      overwrite: true
      value:
        ok: "${branding_result.ok}"
        odoo_url: "${ODOO_URL}"
        branding: "${branding_result}"
