steps:
  - name: Ensure ODOO_URL exists
    if_not: "${ODOO_URL}"
    action: Fail
    params:
      text: "Missing ODOO_URL before eCommerce installation."

  - name: Connect to Odoo tab
    action: CDP.Connect
    params:
      port: "${DEBUG_PORT}"
      open_url: "${ODOO_URL}"
      target_type: page
      target_url_contains: ".odoo.com"

  - name: Navigate to Odoo instance
    action: CDP.Navigate
    params:
      port: "${DEBUG_PORT}"
      url: "${ODOO_URL}"
      wait_ms: 2500

  - name: Load Odoo eCommerce installer script
    action: FS.ReadText
    register: js_odoo_install_ecommerce
    params:
      path: "${PLAYBOOKS_DIR}\\js\\odoo\\rpc_install_ecommerce.js"

  - name: Execute Odoo eCommerce install via in-session JSON-RPC
    action: CDP.EvaluateJson
    register: ecommerce_install_result
    params:
      port: "${DEBUG_PORT}"
      await_promise: true
      expression: "${js_odoo_install_ecommerce}"

  - name: Abort if eCommerce install did not complete
    if_not: "${ecommerce_install_result.ok}"
    action: Fail
    params:
      text: "eCommerce install failed: ${ecommerce_install_result.error}${ecommerce_install_result.reason}"

  - name: Persist installation checkpoint
    action: FS.WriteJson
    params:
      path: "${OUTPUT_DIR}\\odoo_ecommerce_install_checkpoint.json"
      overwrite: true
      value:
        ok: "${ecommerce_install_result.ok}"
        odoo_url: "${ODOO_URL}"
        install: "${ecommerce_install_result}"
